<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS-Only Normal Maps PoC v2</title>
  <style>
    :root {
      --tile-size: 1024px;
      --fade: 0.5;
      --tint-r: 255;
      --tint-g: 64;
      --tint-b: 64;
      --overlay-opacity: 1;
      --comp-r: 87;
      --comp-g: 26;
      --comp-b: 255;
      --gray-brightness: 1;
      --gray-brightness-2: 1;
      --gray-contrast: 1;
      --incidence: 0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #f2f2f2;
      font-family: Segoe UI, Tahoma, sans-serif;
      padding: 24px;
    }

    .wrap {
      width: min(920px, 95vw);
      display: grid;
      gap: 14px;
    }

    .viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      overflow: hidden;
      background: #0b0b0b;
      isolation: isolate;
    }

    #shadowsCompactor{
      position: absolute;
      inset: 0;
      isolation: isolate;
    }
    .layergroup {
      position: absolute;
      inset: 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-repeat: repeat;
      background-size: var(--tile-size) var(--tile-size);
      image-rendering: auto;
    }

    .albedo {
      background-image: url("../assets/Rocks002_1K-JPG_Color.jpg");
      opacity: 1;
    }

    .normal {
      opacity: 1;
    }

    .normal-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }

    #shadowSelector {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .show{
      opacity: 1;
    }
    .hide {
      opacity: 0;
    }

    .normal-incidence {
      background: rgb(
        calc(var(--incidence) * 255)
        calc(var(--incidence) * 255)
        calc(var(--incidence) * 255)
      );
      mix-blend-mode: screen;
      opacity: var(--overlay-opacity);
    }

    .normal-tint {
      background: rgb(var(--tint-r) var(--tint-g) var(--tint-b));
      mix-blend-mode: multiply;
      opacity: var(--overlay-opacity);
    }

    .normal-comp {
      background: rgb(var(--comp-r) var(--comp-g) var(--comp-b));
      mix-blend-mode: multiply;
      opacity: var(--overlay-opacity);
    }
    .multiply {
      mix-blend-mode: multiply;
    }
    
    .grayscale {
      filter: grayscale(100%);
    }

    .quick-controls {
      display: grid;
      gap: 8px;
      background: #1a1a1a;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      padding: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #58a6ff;
    }

    .btn {
      border: 1px solid #3a3a3a;
      background: #252525;
      color: #f2f2f2;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn:hover {
      background: #2d2d2d;
    }

  </style>
</head>
<body>
  <div class="wrap">
    <h1>CSS-Only Normal Maps PoC v2</h1>
    <div class="viewer" aria-label="Tiled rocks texture preview">
      <div class="layer albedo show" aria-hidden="true"></div>
      <div id="shadowsCompactor" class="layergroup shadows show" aria-hidden="true">
        <canvas id="normalCanvas" class="normal normal-canvas show" aria-hidden="true"></canvas>
        <div id="shadowSelector" class="layer multiply show" aria-hidden="true"></div>
        <div id="glnormalization" class="layer multiply show" aria-hidden="true"></div>
      </div>    
    </div>

    <div class="quick-controls">
      <div class="row">
        <span>Azimuth</span>
        <strong id="azimuthAmount">0deg</strong>
      </div>
      <input id="azimuth" type="range" min="0" max="360" value="0" />
      <div class="row">
        <span>Elevation</span>
        <strong id="elevationAmount">0.50</strong>
      </div>
      <input id="elevation" type="range" min="0" max="1" step="0.001" value="0.50" />
      <div class="row-left">
        <label for="animateAzimuth">
          <input id="animateAzimuth" type="checkbox" checked />
          Animate
        </label>
      </div>
      <div class="row-left">
        <button id="openUpload" class="btn" type="button">Upload Texture</button>
        <button id="resetTexture" class="btn" type="button">Reset</button>
      </div>
    </div>
  </div>


  <script>
    const NORMAL_MAP_PATH = "../assets/Rocks002_1K-JPG_NormalGL.jpg";
    const normalCanvas = document.getElementById("normalCanvas");
    const shadowSelector = document.getElementById("shadowSelector");
    const glNormalizationLayer = document.getElementById("glnormalization");
    const shadowCompactor = document.getElementById("shadowsCompactor");
    const viewer = document.querySelector(".viewer");
    const azimuthSlider = document.getElementById("azimuth");
    const elevationSlider = document.getElementById("elevation");
    const animateAzimuthCheckbox = document.getElementById("animateAzimuth");
    const azimuthAmount = document.getElementById("azimuthAmount");
    const elevationAmount = document.getElementById("elevationAmount");
    const normalImage = new Image();
    const phase0 = 0;
    const phaseA = (2 * Math.PI) / 3;
    const phaseB = (4 * Math.PI) / 3;

    function clampByte(value) {
      return Math.max(0, Math.min(255, Math.round(value)));
    }

    function thetaPhiToRgba(theta, phi) {
      const sinPos = (angle) => Math.sin(angle) * 0.5 + 0.5;
      const zWeight = Math.cos(phi - Math.PI / 2);
      const antiZ = Math.cos(phi) * 255;

      return [
        sinPos(theta + phase0) * 255 * zWeight + antiZ,
        sinPos(theta + phaseA) * 255 * zWeight + antiZ,
        sinPos(theta + phaseB) * 255 * zWeight + antiZ,
        255,
      ];
    }



    function remapCanvas(sourceCanvas, targetCanvas) {
      const sourceCtx = sourceCanvas.getContext("2d");
      const targetCtx = targetCanvas.getContext("2d");
      const { width, height } = sourceCanvas;
      const sourceImageData = sourceCtx.getImageData(0, 0, width, height);
      const remappedImageData = targetCtx.createImageData(width, height);
      const source = sourceImageData.data;
      const remapped = remappedImageData.data;

      for (let i = 0; i < source.length; i += 4) {
        const nx = (source[i + 0] / 255) * 2 - 1;
        const ny = (source[i + 1] / 255) * 2 - 1;
        const nz = (source[i + 2] / 255) * 2 - 1;
        const theta = Math.atan2(ny, nx);
        const phi = Math.acos(nz); //never negative

        const [r, g, b, a] = thetaPhiToRgba(theta, phi);
        remapped[i + 0] = r;
        remapped[i + 1] = g;
        remapped[i + 2] = b;
        remapped[i + 3] = a;
      }

      targetCtx.putImageData(remappedImageData, 0, 0);
    }

    function loadNormalMap() {
      if (!normalImage.complete || !normalImage.naturalWidth) return;
      const width = normalImage.naturalWidth;
      const height = normalImage.naturalHeight;
      const sourceCanvas = document.createElement("canvas");
      const sourceCtx = sourceCanvas.getContext("2d");

      sourceCanvas.width = width;
      sourceCanvas.height = height;
      normalCanvas.width = width;
      normalCanvas.height = height;

      sourceCtx.drawImage(normalImage, 0, 0, width, height);
      remapCanvas(sourceCanvas, normalCanvas);
    }

    function updateShadowSelectorFromSliders() {
      const azimuthDeg = Number(azimuthSlider.value);
      const elevation01 = Number(elevationSlider.value);
      const theta = (azimuthDeg * Math.PI) / 180;
      const phi = elevation01 * Math.PI;
      const [r, g, b, a] = thetaPhiToRgba(theta, phi);

      azimuthAmount.textContent = `${azimuthDeg}deg`;
      elevationAmount.textContent = elevation01.toFixed(3);
      shadowSelector.style.backgroundColor = `rgba(${clampByte(r)}, ${clampByte(g)}, ${clampByte(b)}, ${(a / 255).toFixed(3)})`;
    }

    function GrayscaleNormalizationColor(){
      /*
      normalize for grayscale 
      <filter id="grayscale">
        <feColorMatrix type="matrix"
                  values="
          (0.2126 + 0.7874 * [1 - amount]) (0.7152 - 0.7152  * [1 - amount]) (0.0722 - 0.0722 * [1 - amount]) 0 0
          (0.2126 - 0.2126 * [1 - amount]) (0.7152 + 0.2848  * [1 - amount]) (0.0722 - 0.0722 * [1 - amount]) 0 0
          (0.2126 - 0.2126 * [1 - amount]) (0.7152 - 0.7152  * [1 - amount]) (0.0722 + 0.9278 * [1 - amount]) 0 0
          0 0 0 1 0"/>
      </filter>
      https://www.w3.org/TR/filter-effects-1/#grayscaleEquivalent
      */
      // assume amount = 1
      const rc = 0.2126;
      const gc = 0.7152;
      const bc = 0.0722;

      const rci = 1/rc;
      const gci = 1/gc;
      const bci = 1/bc;

      const s = Math.max(rci, gci, bci);
      return [
        rci / s * 255,
        gci / s * 255,
        bci / s * 255,
       255,
        s
      ]
    }

    function applyGrayscaleNormalizationColor() {
      if (!glNormalizationLayer) throw new Error("GL Normalization layer not found");
      const [r, g, b, a, s] = GrayscaleNormalizationColor();
      glNormalizationLayer.style.backgroundColor = `rgba(${clampByte(r)}, ${clampByte(g)}, ${clampByte(b)}, ${(a / 255).toFixed(3)})`;

      if (!shadowCompactor) throw new Error("Shadow compactor not found");
      shadowCompactor.style.filter = `grayscale(1) brightness(${s/2})`;
    }

    let azimuthAnimationFrame = null;
    const azimuthStepPerFrame = 1;

    function animateAzimuthFrame() {
      if (!animateAzimuthCheckbox.checked) {
        azimuthAnimationFrame = null;
        return;
      }

      const max = Number(azimuthSlider.max);
      const current = Number(azimuthSlider.value);
      const next = (current + azimuthStepPerFrame) % (max + 1);
      azimuthSlider.value = String(next);
      updateShadowSelectorFromSliders();
      azimuthAnimationFrame = requestAnimationFrame(animateAzimuthFrame);
    }

    function updateAzimuthAnimationState() {
      if (animateAzimuthCheckbox.checked) {
        if (azimuthAnimationFrame === null) {
          azimuthAnimationFrame = requestAnimationFrame(animateAzimuthFrame);
        }
      } else if (azimuthAnimationFrame !== null) {
        cancelAnimationFrame(azimuthAnimationFrame);
        azimuthAnimationFrame = null;
      }
    }

    normalImage.onload = loadNormalMap;
    normalImage.src = NORMAL_MAP_PATH;
    azimuthSlider.addEventListener("input", updateShadowSelectorFromSliders);
    elevationSlider.addEventListener("input", updateShadowSelectorFromSliders);
    animateAzimuthCheckbox.addEventListener("change", updateAzimuthAnimationState);
    applyGrayscaleNormalizationColor();
    updateShadowSelectorFromSliders();
    updateAzimuthAnimationState();
  </script>
</body>
</html>
